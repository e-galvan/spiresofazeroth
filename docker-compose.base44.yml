# Base44 sandbox run for Spires of Azeroth.
# The game is a static, build-free ES-module site, so the only service is a plain
# nginx that serves this checkout directly (edits show up on reload, nothing is baked
# into an image). See .base44/nginx.conf and AGENTS.md.
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      # Only the game folder is mounted: the sandbox checkout's root directory is mode 700,
      # which a non-root nginx worker cannot traverse, while the game folder itself is world-readable.
      - ./spiresofazeroth:/srv/repo/spiresofazeroth:ro
      - ./.base44/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/spiresofazeroth/ | grep -q 'Spires of Azeroth' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      base44.project: "Spires of Azeroth"
      base44.kind: "web"
      base44.port: "3000"
