# Sandbox-only web entry for docker-compose.base44.yml (Base44 preview, host port 3000).
#
# Serves the checkout at /srv/repo and mirrors what tools/spires/dev-server.mjs does for a
# fresh clone: the public repository ships no Blizzard art/audio, no Three.js vendor copy and
# no shared site chrome, so those paths fall back to the live site. Everything else (the game's
# own HTML/CSS/JS/data) is served from the checkout, and no other path is proxied.
server {
  listen 3000;
  server_name _;
  root /srv/repo;
  index index.html;
  absolute_redirect off;

  # The preview iframe opens "/"; the game itself lives under /spiresofazeroth/.
  location = / { return 302 /spiresofazeroth/; }

  # Checkout first, live site for whatever the repository does not ship.
  location ^~ /assets/                { try_files $uri $uri/ @remote; }
  location ^~ /media/sounds/          { try_files $uri $uri/ @remote; }
  location ^~ /spiresofazeroth/assets/ { try_files $uri $uri/ @remote; }
  location ^~ /static/                { try_files $uri $uri/ @remote; }

  # The shared TheWoWDB chrome, which the page loads from the live site, probes this path to
  # paint its account label. This checkout has no auth backend at all, so answer the anonymous
  # state the chrome already falls back to instead of logging a network error on every load.
  location = /api/auth/me {
    default_type application/json;
    return 200 '{"user":null,"active_character":null}';
  }

  # Game source and data: local only. Every other /api/* path stays unproxied on purpose, so the
  # in-game bug form falls back to its GitHub issues link instead of mailing the live site.
  location / { try_files $uri $uri/ =404; }

  location @remote {
    resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;
    set $site_host thewowdb.com;
    proxy_pass https://$site_host$request_uri;
    proxy_set_header Host $site_host;
    proxy_set_header User-Agent "spires-base44-preview";
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
  }
}
